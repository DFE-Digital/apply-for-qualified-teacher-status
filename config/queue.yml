default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [default, mailer, analytics]
      threads: <%= ENV.fetch("QUEUE_THREADS", 5) %>
      processes: <%= ENV.fetch("QUEUE_PROCESSES", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
