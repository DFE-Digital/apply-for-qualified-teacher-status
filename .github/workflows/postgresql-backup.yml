name: PostgreSQL - Backup

on:
  push:
    branches:
      - 3186-tests-new-postgres-backups

  workflow_dispatch:
    inputs:
      environment:
        required: true
        default: test
        type: choice
        options:
          - test

permissions:
  id-token: write

env:
  SERVICE_NAME: apply-for-qts
  SERVICE_SHORT: afqts
  TF_VARS_PATH: terraform/application/config

jobs:
  backup:
    name: PostgreSQL Backup
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment || 'test' }}

    env:
      DEPLOY_ENV: ${{ inputs.environment || 'test' }}

    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: DFE-Digital/github-actions/postgres-tools@master
        with:
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          operation: backup
          service-name: ${{ env.SERVICE_NAME }}
          service-short: ${{ env.SERVICE_SHORT }}
          environment: ${{ env.DEPLOY_ENV }}
          tf-vars-path: ${{ env.TF_VARS_PATH }}
